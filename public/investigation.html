<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta value="no-cache, no-store, must-revalidate" name="no-cache" />

    <!-- Font Awesome kit, basic kit york license -->
    <script
      src="https://kit.fontawesome.com/2c7bfef965.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="shortcut icon" type="image/png" href="img/logo/logo.png" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css"
      rel="stylesheet"
    />

    <!-- Fontawesome -->
    <link rel="shortcut icon" type="image/png" href="img/logo/logo.png" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Custom style -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/investigation.css" />

    <!-- call menu and footer sections -->
    <script src="sections/menu.js" defer></script>

    <!-- Firebase SDK -->
    <script defer src="/__/firebase/10.5.2/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/10.5.2/firebase-auth-compat.js"></script>
    <script
      defer
      src="/__/firebase/10.5.2/firebase-database-compat.js"
    ></script>
    <script
      defer
      src="/__/firebase/10.5.2/firebase-firestore-compat.js"
    ></script>
    <script defer src="/__/firebase/10.5.2/firebase-storage-compat.js"></script>

    <!-- Initialize Firebase -->
    <script defer src="/__/firebase/init.js"></script>

    <!-- User authentication functions -->
    <script defer src="js/user/isLogin.js"></script>

    <title>Investigaciones</title>
  </head>

  <body class="vh-100" onload="validar()">
    <header>
      <menu-component></menu-component>
    </header>
    <section>
      <div class="wave">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>

    <main class="container">
      <div class="d-flex justify-content-between align-items-center mt-5">
        <h4 class="text-white">Lista de investigaciones</h4>
        <button
          type="button"
          class="btn btn-sm btn-primary add-investigation"
          data-bs-toggle="modal"
          data-bs-target="#addInvestModal"
        >
          Agregar investigación
        </button>
      </div>
      <br />
      <div id="tablaCateg"></div>

      <!-- Modal de imágenes -->
      <div
        id="modal"
        class="modal fade"
        tabindex="-1"
        aria-labelledby="modalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalLabel">
                Imágenes de la Investigación
              </h5>
              <!-- Botón para cerrar el modal usando Bootstrap -->
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div id="modalContent" class="modal-body">
              <!-- Carrusel o contenido de las imágenes se inyectará aquí -->
            </div>
          </div>
        </div>
      </div>

      <!-- Modal para Editar Datos -->
      <div
        id="editModal"
        class="modal fade"
        tabindex="-1"
        aria-labelledby="editModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content shadow-lg">
            <div class="modal-header custom-modal-header text-white">
              <h5 class="modal-title" id="editModalLabel">
                <i class="fas fa-edit me-2"></i>Editar Investigación
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>
            <div class="modal-body" id="modal2">
              <form id="editForm" class="needs-validation" novalidate>
                <!-- Título -->
                <div class="mb-3">
                  <label for="editTitulo" class="form-label fw-bold"
                    >Título:</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="editTitulo"
                    placeholder="Ingresa el título"
                    required
                  />
                  <div class="invalid-feedback">Este campo es obligatorio.</div>
                </div>

                <!-- Área -->
                <div class="mb-3">
                  <label for="editArea" class="form-label fw-bold"
                    >Área de interés:</label
                  >
                  <select id="editArea" class="form-select" required>
                    <option value="">Selecciona un área</option>
                    <option value="Ciencias Agropecuarias">
                      Ciencias Agropecuarias
                    </option>
                    <option value="Tecnología">Tecnología</option>
                    <option value="Ingeniería">Ingeniería</option>
                    <option value="Ciencias Administrativas">
                      Ciencias Administrativas
                    </option>
                    <option value="Educación">Educación</option>
                    <option value="Artes y Humanidades">
                      Artes y Humanidades
                    </option>
                  </select>
                  <div class="invalid-feedback">Este campo es obligatorio.</div>
                </div>

                <!-- Descripción -->
                <div class="mb-3">
                  <label for="editDescripcion" class="form-label fw-bold"
                    >Descripción:</label
                  >
                  <textarea
                    class="form-control"
                    id="editDescripcion"
                    rows="3"
                    placeholder="Escribe una descripción"
                    required
                  ></textarea>
                  <div class="invalid-feedback">Este campo es obligatorio.</div>
                </div>

            

                <!-- Recomendación -->
                <div class="mb-3">
                  <label for="editRecomendacion" class="form-label fw-bold"
                    >Recomendación:</label
                  >
                  <textarea
                    class="form-control"
                    id="editRecomendacion"
                    rows="3"
                    placeholder="Escribe la recomendación"
                    required
                  ></textarea>
                  <div class="invalid-feedback">Este campo es obligatorio.</div>
                </div>

                <!-- Subir PDF -->
                <div class="mb-3">
                  <label for="editPdf" class="form-label fw-bold"
                    >Actualizar archivo:</label
                  >
                  <input
                    type="file"
                    class="form-control"
                    id="editArchivo"
                    accept=".pdf,.doc,.docx,.txt,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"
                    required
                  />
                </div>

                <!-- Subir Imágenes -->
                <div class="mb-3">
                  <label for="editImages" class="form-label fw-bold"
                    >Actualizar Imágenes:</label
                  >
                  <input
                    type="file"
                    class="form-control"
                    id="editImages"
                    accept="image/*"
                    multiple
                  />
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" form="editForm" class="btn btn-success">
                <i class="fas fa-save me-2"></i>Guardar Cambios
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal para Agregar Investigación -->
      <div
        class="modal fade"
        id="addInvestModal"
        tabindex="-1"
        aria-labelledby="addInvestModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content modal-form">
            <div class="modal-header custom-modal-header text-white">
              <h5 class="modal-title" id="addInvestModalLabel">
                <i class="fas fa-plus me-2"></i>Agregar Investigación
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>
            <div class="modal-body">
              <form id="addInvestForm">
                <!-- Título -->
                <div class="mb-3">
                  <label for="newTitulo" class="form-label fw-bold"
                    >Título:</label
                  >
                  <input
                    type="text"
                    id="newTitulo"
                    class="form-control"
                    placeholder="Ingresa el título"
                    required
                  />
                </div>
                <!-- Área de interés -->
                <div class="mb-3">
                  <label for="newArea" class="form-label fw-bold"
                    >Área de interés:</label
                  >
                  <select id="newArea" class="form-select" required>
                    <option value="">Selecciona un área</option>
                    <option value="Ciencias Agropecuarias">
                      Ciencias Agropecuarias
                    </option>
                    <option value="Tecnología">Tecnología</option>
                    <option value="Ingeniería">Ingeniería</option>
                    <option value="Ciencias Administrativas">
                      Ciencias Administrativas
                    </option>
                    <option value="Educación">Educación</option>
                    <option value="Artes y Humanidades">
                      Artes y Humanidades
                    </option>
                  </select>
                </div>
                <!-- Descripción -->
                <div class="mb-3">
                  <label for="newDescripcion" class="form-label fw-bold"
                    >Descripción:</label
                  >
                  <textarea
                    id="newDescripcion"
                    class="form-control"
                    rows="3"
                    placeholder="Ingresa la descripción"
                    required
                  ></textarea>
                </div>
                <!-- Imágenes -->
                <div class="mb-3">
                  <label for="newUrlImage" class="form-label fw-bold"
                    >Imágenes:</label
                  >
                  <input
                    type="file"
                    id="newUrlImage"
                    class="form-control"
                    accept="image/*"
                    multiple
                    required
                  />
                </div>
                <!-- PDF -->
                <div class="mb-3">
                  <label for="newUrlPdf" class="form-label fw-bold"
                    >Archivo:</label
                  >
                  <input
                    type="file"
                    id="newUrlArchivo"
                    class="form-control"
                    accept=".pdf,.doc,.docx,.txt,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"
                    required
                  />
                </div>
                <!-- Recomendación -->
                <div class="mb-3">
                  <label for="newRecomendacion" class="form-label fw-bold"
                    >Recomendación:</label
                  >
                  <textarea
                    id="newRecomendacion"
                    class="form-control"
                    rows="3"
                    placeholder="Ingresa la recomendación"
                    required
                  ></textarea>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button
                type="submit"
                form="addInvestForm"
                class="btn btn-success"
              >
                <i class="fas fa-save me-2"></i>Guardar
                <!-- Spinner -->

              </button>
              <div id="progressBar" class="progress" style="display: none;">
                <div class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
            
          </div>
        </div>
      </div>
    </main>

    <!-- JS Code for managing data storage -->
    <script defer src="js/investigation/lstInvestigations.js"></script>
    <script defer src="js/user/user-state-updater.js"></script>
    <script defer src="js/investigation/adInvestigation.js"></script>
    <script defer src="js/user/authen.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
