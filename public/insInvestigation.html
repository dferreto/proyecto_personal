<body class="container-fluid" onload="validar()">
<header>
    <menu-component></menu-component>
</header>

<main>
    <h4 class="text-center">Agrega Investigación</h4>
    <br>
    <div class="container container-insert">
        <form>
            <div class="mb-3">
                <label class="form-label"><strong>Título de la investigación</strong></label>
                <input type="text" id="txtTitulo" class="form-control" maxlength="60">
            </div>
            <div class="mb-3">
                <label class="form-label"><strong>Área de interés</strong></label>
                <select class="form-select" id="txtArea">
                    <option selected>Selecciona un área</option>
                    <option value="Ciencias Agropecuarias">Ciencias Agropecuarias</option>
                    <option value="Tecnologia">Tecnología</option>
                    <option value="Ingenieria">Ingeniería</option>
                    <option value="Ciencias Administrativas">Ciencias Administrativas</option>
                    <option value="Educacion">Educación</option>
                    <option value="Artes y Humanidades">Artes y Humanidades</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label"><strong>Descripción del tema</strong></label>
                <textarea id="txtDescripcion" class="form-control" rows="4" maxlength="500"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label"><strong>Imagen</strong></label>
                <input type="file" id="txtUrlImage" class="form-control" multiple>
                <div id="imagePreviewContainer" class="preview-container d-flex flex-wrap"></div>
            </div>
            <div class="mb-3">
                <label class="form-label"><strong>PDF</strong></label>
                <input type="file" id="txtUrlPdf" class="form-control">
                <embed id="pdfSalida" type="application/pdf" width="100%" height="200px" style="display:none; margin-top:10px;"/>
            </div>
            <div class="mb-3">
                <label class="form-label"><strong>Conclusión</strong></label>
                <textarea id="txtConclusion" class="form-control" rows="4" maxlength="500"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label"><strong>Recomendación</strong></label>
                <textarea id="txtRecomendacion" class="form-control" rows="4" maxlength="500"></textarea>
            </div>
            <div class="text-center">
                <button type="button" id="btnLoad" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</main>
<script defer src="js/investigation/adInvestigation.js"></script>
<script defer src="js/user/authen.js"></script>
<script defer src="js/user/user-state-updater.js"></script>
<script>
    $(document).ready(function() {
        $('#txtUrlImage').change(function(e) {
            var files = e.target.files;
            $('#imagePreviewContainer').html('');
            Array.from(files).forEach(file => {
                if (!file.type.match(/image.*/)) return;
                var reader = new FileReader();
                reader.onload = function(e) {
                    $('#imagePreviewContainer').append($('<img>').attr("src", e.target.result).addClass('img-preview'));
                }
                reader.readAsDataURL(file);
            });
        });
        $('#txtUrlPdf').change(function(e) {
            var file = e.target.files[0];
            if (file.type !== 'application/pdf') {
                alert("El archivo no es un PDF.");
                return;
            }
            var reader = new FileReader();
            reader.onload = function(e) {
                $('#pdfSalida').attr("src", e.target.result).show();
            }
            reader.readAsDataURL(file);
        });
    });
</script>
